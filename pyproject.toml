[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grande"
version = "2.0.2"
description = "Work with spreadsheets too big for Excel — browse, filter, pivot and export tens of millions of rows, entirely on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grande contributors" }]
keywords = ["excel", "csv", "parquet", "duckdb", "pivot", "big data", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

dependencies = [
  "duckdb>=1.1",        # query engine + on-disk storage; does the heavy lifting
  "flask>=3.0",         # tiny HTTP layer, loopback only
  "waitress>=3.0",      # production-grade threaded WSGI server (Flask's dev server is not)
  "xlsxwriter>=3.2",    # constant-memory .xlsx writing
  "python-calamine>=0.2",  # fast Rust .xlsx/.xls reading
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "hypothesis>=6.100", "psutil>=5.9"]

[project.scripts]
grande = "grande.__main__:main"

[project.urls]
Homepage = "https://github.com/ojashtripathi/Grande"

[tool.hatch.build.targets.wheel]
packages = ["src/grande"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
